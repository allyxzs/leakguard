name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go vet ./...
      - run: go test ./... -v
      - run: go build -o leakguard ./cmd/leakguard
      - name: Verificar falsos positivos no próprio projeto
        run: go run ./cmd/leakguard scan --no-color
