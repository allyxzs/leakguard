name: LeakGuard

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo para o modo history
      - uses: ./ # em outros repositórios: allyxzs/leakguard@v1
        with:
          mode: history
      - name: Enviar SARIF para o Code Scanning
        if: always() && hashFiles('leakguard.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: leakguard.sarif
